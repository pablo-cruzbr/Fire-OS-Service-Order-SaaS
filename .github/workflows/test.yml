name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: ./Backend

      - name: Type-check
        run: npm run typecheck
        working-directory: ./Backend

      - name: Lint
        run: npm run lint
        working-directory: ./Backend

      - name: Run tests
        run: npm run test
        working-directory: ./Backend
